<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayti - Offline</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fff7ed; }
    .container { text-align: center; padding: 2rem; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { color: #f97316; margin-bottom: 0.5rem; }
    p { color: #6b7280; margin-bottom: 1.5rem; }
    button { background: #f97316; color: white; border: none; padding: 0.75rem 2rem; border-radius: 1rem; font-size: 1rem; cursor: pointer; }
    button:hover { background: #ea6b00; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🏠</div>
    <h1>You're offline</h1>
    <p>Check your connection and try again</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
